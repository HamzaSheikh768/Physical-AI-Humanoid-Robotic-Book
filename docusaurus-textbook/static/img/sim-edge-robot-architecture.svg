<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">

  <style>
    .node {
      fill: #e3f2fd;
      stroke: #1976d2;
      stroke-width: 2px;
    }
    .title {
      font: bold 18px sans-serif;
      fill: #1a237e;
      text-anchor: middle;
    }
    .label {
      font: 14px sans-serif;
      fill: #1a237e;
      text-anchor: middle;
    }
    .arrow {
      stroke: #1976d2;
      stroke-width: 2px;
      marker-end: url(#arrowhead);
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1976d2"/>
    </marker>
  </defs>

  <text x="400" y="50" class="title">
    Simulation to Edge to Robot Architecture
  </text>

  <rect x="50" y="150" width="180" height="100" rx="10" ry="10" class="node"/>
  <text x="140" y="180" class="label">Simulation Rig</text>
  <text x="140" y="200" class="label">(High-Performance</text>
  <text x="140" y="220" class="label">Workstation)</text>

  <rect x="310" y="150" width="180" height="100" rx="10" ry="10" class="node"/>
  <text x="400" y="180" class="label">Edge Brain</text>
  <text x="400" y="200" class="label">(Jetson Orin</text>
  <text x="400" y="220" class="label">AI Kit)</text>

  <rect x="570" y="150" width="180" height="100" rx="10" ry="10" class="node"/>
  <text x="660" y="180" class="label">Robot Platform</text>
  <text x="660" y="200" class="label">(Physical</text>
  <text x="660" y="220" class="label">Robot)</text>

  <line x1="230" y1="200" x2="310" y2="200" class="arrow"/>
  <line x1="490" y1="200" x2="570" y2="200" class="arrow"/>

  <text x="270" y="190" class="label">Data &amp; Models</text>
  <text x="530" y="190" class="label">Commands &amp;</text>
  <text x="530" y="210" class="label">Controls</text>

  <text x="400" y="350" class="label">
    This architecture shows the flow from simulation to edge AI processing to physical robot execution
  </text>

</svg>
